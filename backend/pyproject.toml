[project]
name = "engine-room-assistant"
version = "0.1.0"
description = "기관실 알람 대응 어시스턴트 — 로컬 LLM·RAG·MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "lancedb>=0.20",
  "pyarrow>=17",
  "pyyaml>=6",
]

[dependency-groups]
# 매뉴얼 PDF를 만들 때 쓴다. 테스트도 설정값 표를 만들어 보므로 dev에 포함한다.
manual = ["markdown>=3.6"]
# 문서 수집에만 필요하다(Docling은 torch를 끌고 온다). CI에서는 설치하지 않는다.
ingest = ["docling>=2", { include-group = "manual" }]
dev = ["pytest>=8", { include-group = "manual" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
