[project]
name = "engine-room-assistant"
version = "0.1.0"
description = "기관실 알람 대응 어시스턴트 — 로컬 LLM·RAG·MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "lancedb>=0.20",
  "pyarrow>=17",
  "pyyaml>=6",
]

[dependency-groups]
# 문서 수집에만 필요하다(Docling은 torch를 끌고 온다).
ingest = ["docling>=2", "markdown>=3.6"]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
